name: offline-evaluation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Public CI has no host-owned model executor or release credentials.
      # Recorded fixtures are regression inputs, never a release decision.
      - name: Verify versioned offline fixtures (non-release)
        run: >-
          python -m market_agent.evaluation_fixture_cli
          --manifest evals/datasets/offline-safety-v1.manifest.json
      - name: Verify executed release-gate contract
        run: >-
          python -m pytest -q
          market_agent_test_bundle/tests/test_executed_evaluation.py
          market_agent_test_bundle/tests/test_evaluation_fixture_cli.py
